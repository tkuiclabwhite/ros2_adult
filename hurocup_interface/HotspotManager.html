<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>熱點裝置管理</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 16px;
    background: #0b0f0d;
    color: #e6e6e6;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif;
  }

  h1 {
    font-size: 20px;
    margin: 0 0 12px;
    color: #00fa9a;
  }

  #status-card {
    background: #121815;
    border: 1px solid #1f2b26;
    border-left: 6px solid #555;
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 16px;
  }

  #status-card.active { border-left-color: #00fa9a; }
  #status-card.inactive { border-left-color: #e05555; }

  .status-row {
    display: flex;
    justify-content: space-between;
    font-size: 15px;
    padding: 3px 0;
  }

  .status-row span:first-child { color: #999; }

  #refresh-info {
    font-size: 12px;
    color: #666;
    text-align: right;
    margin-bottom: 10px;
  }

  #device-list { display: flex; flex-direction: column; gap: 10px; }

  .device-card {
    background: #121815;
    border: 1px solid #1f2b26;
    border-radius: 10px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .device-card.blocked {
    background: #1a1a1a;
    border-color: #333;
    color: #888;
  }

  .device-card.offline {
    opacity: 0.6;
  }

  .device-name-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .device-hostname {
    font-size: 17px;
    font-weight: 600;
    color: #fff;
    word-break: break-all;
    flex: 1;
    min-width: 0;
  }

  .device-card.blocked .device-hostname { color: #999; }

  .device-detail {
    font-size: 13px;
    color: #999;
    line-height: 1.5;
  }

  .device-card.blocked .device-detail { color: #666; }

  .badge-blocked {
    display: inline-block;
    font-size: 11px;
    background: #4a1f1f;
    color: #ff8a8a;
    border-radius: 4px;
    padding: 1px 6px;
    margin-left: 6px;
  }

  .badge-offline {
    display: inline-block;
    font-size: 11px;
    background: #333;
    color: #999;
    border-radius: 4px;
    padding: 1px 6px;
    margin-left: 6px;
  }

  .badge-online {
    display: inline-block;
    font-size: 11px;
    background: #0f3d2b;
    color: #00fa9a;
    border-radius: 4px;
    padding: 1px 6px;
    margin-left: 6px;
  }

  .icon-btn {
    flex-shrink: 0;
    border: 1px solid #2a3a34;
    background: #1a231f;
    color: #ccc;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 14px;
  }

  .icon-btn:active { opacity: 0.7; }

  .device-actions {
    display: flex;
    gap: 8px;
    margin-top: 6px;
  }

  .action-btn {
    flex: 1;
    border: none;
    border-radius: 8px;
    padding: 12px 10px;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    background: #2a4a6b;
  }

  .action-btn:active { opacity: 0.7; }

  .kick-btn {
    flex: 1;
    border: none;
    border-radius: 8px;
    padding: 12px 10px;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    background: #b23b3b;
  }

  .kick-btn:active { opacity: 0.7; }

  .unkick-btn {
    background: #2a6b52;
  }

  #empty-msg {
    text-align: center;
    color: #666;
    padding: 30px 0;
    font-size: 14px;
  }

  #toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    background: #1f2b26;
    color: #e6e6e6;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    border: 1px solid #00fa9a;
  }

  #toast.show { opacity: 1; }
</style>
</head>
<body>

  <h1>熱點裝置管理</h1>

  <div id="status-card">
    <div class="status-row"><span>SSID</span><span id="status-ssid">--</span></div>
    <div class="status-row"><span>IP</span><span id="status-ip">--</span></div>
    <div class="status-row"><span>狀態</span><span id="status-active">--</span></div>
    <div class="status-row"><span>系統時間</span><span id="status-time">--</span></div>
  </div>

  <div id="refresh-info">每 5 秒自動更新</div>

  <div id="device-list"></div>
  <div id="empty-msg" style="display:none;">目前沒有連線裝置</div>

  <div id="toast"></div>

<script>
  // 透過 file:// 直接開啟（例如電腦用 SFTP 掛載後雙擊開檔）時沒有 hostname，
  // 這台熱點 IP 固定，直接 fallback 回去就好。
  const API_BASE = 'http://' + (window.location.hostname || '10.10.10.10') + ':5050';
  let toastTimer = null;

  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
  }

  async function loadHotspotStatus() {
    try {
      const res = await fetch(API_BASE + '/hotspot_status');
      const data = await res.json();
      document.getElementById('status-ssid').textContent = data.ssid;
      document.getElementById('status-ip').textContent = data.ip;
      document.getElementById('status-time').textContent = data.time || '--';
      const activeEl = document.getElementById('status-active');
      activeEl.textContent = data.active ? '運作中' : '未運作';
      const card = document.getElementById('status-card');
      card.className = data.active ? 'active' : 'inactive';
    } catch (e) {
      document.getElementById('status-active').textContent = '無法連線';
    }
  }

  function renderDevices(devices) {
    const list = document.getElementById('device-list');
    const emptyMsg = document.getElementById('empty-msg');
    list.innerHTML = '';

    if (!devices.length) {
      emptyMsg.style.display = 'block';
      return;
    }
    emptyMsg.style.display = 'none';

    devices.forEach(dev => {
      const card = document.createElement('div');
      card.className = 'device-card' + (dev.blocked ? ' blocked' : (dev.connected ? '' : ' offline'));

      const nameRow = document.createElement('div');
      nameRow.className = 'device-name-row';

      const nameEl = document.createElement('div');
      nameEl.className = 'device-hostname';
      const displayName = dev.nickname || dev.hostname || '(未知裝置)';
      let statusBadge;
      if (dev.blocked) {
        statusBadge = '<span class="badge-blocked">已封鎖</span>';
      } else if (dev.connected) {
        statusBadge = '<span class="badge-online">已連線</span>';
      } else {
        statusBadge = '<span class="badge-offline">離線</span>';
      }
      nameEl.innerHTML = escapeHtml(displayName) + statusBadge;

      const renameBtn = document.createElement('button');
      renameBtn.className = 'icon-btn';
      renameBtn.textContent = '✎';
      renameBtn.onclick = () => renameDevice(dev);

      nameRow.appendChild(nameEl);
      nameRow.appendChild(renameBtn);

      const details = document.createElement('div');
      details.innerHTML = `
        <div class="device-detail">IP: ${escapeHtml(dev.ip)}</div>
        <div class="device-detail">MAC: ${escapeHtml(dev.mac)}</div>
        <div class="device-detail">租約到期時間: ${escapeHtml(dev.lease_expires)}</div>
        <div class="device-detail">固定 IP: ${dev.reserved_ip ? escapeHtml(dev.reserved_ip) : '未設定'}</div>
      `;

      const actions = document.createElement('div');
      actions.className = 'device-actions';

      const reserveBtn = document.createElement('button');
      reserveBtn.className = 'action-btn';
      if (dev.reserved_ip) {
        reserveBtn.textContent = '取消固定IP';
        reserveBtn.onclick = () => unreserveDevice(dev.mac);
      } else {
        reserveBtn.textContent = '設定固定IP';
        reserveBtn.onclick = () => reserveDevice(dev);
      }

      const kickBtn = document.createElement('button');
      if (dev.blocked) {
        kickBtn.className = 'kick-btn unkick-btn';
        kickBtn.textContent = '解除';
        kickBtn.onclick = () => unkickDevice(dev.mac);
      } else {
        kickBtn.className = 'kick-btn';
        kickBtn.textContent = '踢除';
        kickBtn.onclick = () => kickDevice(dev.mac);
      }

      actions.appendChild(reserveBtn);
      actions.appendChild(kickBtn);

      card.appendChild(nameRow);
      card.appendChild(details);
      card.appendChild(actions);
      list.appendChild(card);
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  async function loadDevices() {
    try {
      const res = await fetch(API_BASE + '/devices');
      const devices = await res.json();
      renderDevices(devices);
    } catch (e) {
      // 連不到 API 時保留目前畫面，不清空清單
    }
  }

  async function kickDevice(mac) {
    try {
      const res = await fetch(API_BASE + '/kick', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mac }),
      });
      const data = await res.json();
      if (data.success) {
        showToast('已踢除裝置');
      } else {
        showToast('踢除失敗: ' + (data.error || ''));
      }
    } catch (e) {
      showToast('無法連線至 API');
    }
    loadDevices();
  }

  async function unkickDevice(mac) {
    try {
      const res = await fetch(API_BASE + '/kick/' + encodeURIComponent(mac), {
        method: 'DELETE',
      });
      const data = await res.json();
      if (data.success) {
        showToast('已解除封鎖');
      } else {
        showToast('解除失敗: ' + (data.error || ''));
      }
    } catch (e) {
      showToast('無法連線至 API');
    }
    loadDevices();
  }

  async function renameDevice(dev) {
    const name = window.prompt('輸入裝置暱稱（留空可清除）', dev.nickname || '');
    if (name === null) return;
    try {
      const res = await fetch(API_BASE + '/devices/' + encodeURIComponent(dev.mac), {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nickname: name.trim() }),
      });
      const data = await res.json();
      showToast(data.success ? '已更新暱稱' : '更新失敗: ' + (data.error || ''));
    } catch (e) {
      showToast('無法連線至 API');
    }
    loadDevices();
  }

  async function reserveDevice(dev) {
    const ip = window.prompt('輸入要固定的 IP（10.10.10.0/24 網段）', dev.reserved_ip || '10.10.10.');
    if (ip === null) return;
    try {
      const res = await fetch(API_BASE + '/devices/' + encodeURIComponent(dev.mac) + '/reserve', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ip: ip.trim() }),
      });
      const data = await res.json();
      if (data.success) {
        showToast('已設定固定 IP，' + (data.note || ''));
      } else {
        showToast('設定失敗: ' + (data.error || ''));
      }
    } catch (e) {
      showToast('無法連線至 API');
    }
    loadDevices();
  }

  async function unreserveDevice(mac) {
    try {
      const res = await fetch(API_BASE + '/devices/' + encodeURIComponent(mac) + '/reserve', {
        method: 'DELETE',
      });
      const data = await res.json();
      showToast(data.success ? '已取消固定 IP' : '取消失敗: ' + (data.error || ''));
    } catch (e) {
      showToast('無法連線至 API');
    }
    loadDevices();
  }

  function refreshAll() {
    loadHotspotStatus();
    loadDevices();
  }

  refreshAll();
  setInterval(refreshAll, 5000);
</script>

</body>
</html>
